services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    command: ["uv", "run", "--no-dev", "arq", "app.queue.worker.WorkerSettings"]

  mcp:
    build: ./mcp
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"
    expose:
      - "8001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - mcp

volumes:
  caddy_data:
  caddy_config:
