name: FlowAgent Run
description: Run a FlowAgent workflow and capture its output in CI.
inputs:
  api_url:
    description: FlowAgent backend base URL
    required: true
  workflow_id:
    description: Workflow id to run
    required: true
  input:
    description: Input passed to the workflow
    required: false
    default: ""
outputs:
  result:
    description: The workflow output
    value: ${{ steps.run.outputs.result }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        run_id=$(curl -sf -X POST "${{ inputs.api_url }}/run/${{ inputs.workflow_id }}" \
          -H "Content-Type: application/json" \
          -d "{\"input\": \"${{ inputs.input }}\"}" | python3 -c "import sys,json;print(json.load(sys.stdin)['run_id'])")
        for i in $(seq 1 120); do
          sleep 1
          status=$(curl -sf "${{ inputs.api_url }}/runs/$run_id")
          state=$(echo "$status" | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")
          if [ "$state" = "done" ] || [ "$state" = "error" ]; then
            echo "result=$(echo "$status" | python3 -c "import sys,json;print(json.dumps(json.load(sys.stdin).get('output')))")" >> "$GITHUB_OUTPUT"
            break
          fi
        done
